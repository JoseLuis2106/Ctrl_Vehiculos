planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" # Plugin para Hybrid A*
      allow_reverse_expansion: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_lane_iterations: 1000
      downsample_costmap: false
      allow_unknown: true
      # Parámetros cinemáticos del coche
      minimum_turning_radius: 3.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      motion_model_for_search: "REEDS_SHEPP"
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.1
      cost_penalty: 2.0
      # Esto genera el tramo recto final para centrarse
      analytic_expansion_ratio: 3.5 

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0     # Debe ser double
      publish_frequency: 1.0    # Debe ser double
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      
      # TAMAÑO DEL MAPA (Ajustado para que el coche no esté "out of bounds")
      rolling_window: true
      width: 15                 # Debe ser integer
      height: 15                # Debe ser integer
      resolution: 0.05
      
      # DIMENSIONES DEL VEHÍCULO
      robot_radius: 0.9 
      footprint: "[ [1.5, 0.7], [1.5, -0.7], [-1.0, -0.7], [-1.0, 0.7] ]"
      
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 5.0
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 9.0
          sensor_frame: ""

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Radio de inflación mayor al radio del coche para seguridad
        inflation_radius: 1.2 
        cost_scaling_factor: 3.0
