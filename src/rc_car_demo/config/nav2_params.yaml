planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.1
      max_iterations: 20000000
      max_on_approach_iterations: 10000
      downsample_costmap: false
      allow_unknown: true
      minimum_turning_radius: 0.6                 # Necesitara cambios
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      motion_model_for_search: "REEDS_SHEPP"
      reverse_penalty: 1.0
      change_penalty: 2.5
      non_straight_penalty: 1.3
      cost_penalty: 1.65
      analytic_expansion_ratio: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0 
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      
      rolling_window: true
      width: 20      
      height: 20 
      resolution: 0.1
      
      robot_radius: 0.4                         # Necesitara cambios
      footprint: "[ [0.26, 0.12], [0.26, -0.12], [-0.04, -0.12], [-0.04, 0.12] ]"           # Necesitara cambios
      
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud_source
        pointcloud_source:
          topic: /prius/center_laser/scan
          sensor_frame: center_laser_link
          data_type: "PointCloud2"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 1.8

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom 
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      footprint: "[ [0.26, 0.12], [0.26, -0.12], [-0.04, -0.12], [-0.04, 0.12] ]"           # Necesitara cambios
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /prius/center_laser/scan
          data_type: "PointCloud2"
          clearing: True
          marking: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3                                                       # Necesitara cambios
        cost_scaling_factor: 1.8
  
